<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <link rel="stylesheet" href="assets/game.css">
</head>
<body>
    <div class="topbar">
        <a href="index.html">← Menu</a>
        <h1>Pong</h1>
        <span style="width:70px"></span>
    </div>

    <div class="stage">
        <canvas id="pong" width="800" height="500"></canvas>

        <div class="overlay" id="overlay">
            <h2 id="ov-title">Pong</h2>
            <p id="ov-text">Chegue primeiro à pontuação-alvo para vencer a IA.</p>
            <div class="row" id="ov-config">
                <label>Jogadores
                    <select id="players">
                        <option value="1" selected>1 (contra a IA)</option>
                        <option value="2">2 (mesmo teclado)</option>
                    </select>
                </label>
                <label>Dificuldade
                    <select id="difficulty">
                        <option value="easy">Fácil</option>
                        <option value="normal" selected>Normal</option>
                        <option value="hard">Difícil</option>
                    </select>
                </label>
                <label>Pontos para vencer
                    <select id="target">
                        <option value="5">5</option>
                        <option value="7" selected>7</option>
                        <option value="11">11</option>
                    </select>
                </label>
            </div>
            <button class="btn" id="ov-button">Iniciar jogo</button>
            <div class="panel" id="stats-panel" style="min-width:300px">
                <table class="data" id="stats">
                    <thead><tr><th>Dificuldade</th><th>Vitórias</th><th>Derrotas</th><th>Aproveitamento</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <p class="hint">
        1 jogador: <kbd>↑</kbd> <kbd>↓</kbd> ou <kbd>W</kbd> <kbd>S</kbd> · 2 jogadores: <kbd>W</kbd> <kbd>S</kbd> (esquerda) e <kbd>↑</kbd> <kbd>↓</kbd> (direita) · <kbd>Espaço</kbd>/<kbd>P</kbd> pausa ·
        em telas de toque, arraste o dedo sobre o campo
    </p>

    <script src="assets/audio.js"></script>
    <script src="assets/fit.js"></script>
    <script src="pong-logic.js"></script>
    <script src="pong.js"></script>
</body>
</html>
