<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <link rel="stylesheet" href="assets/game.css">
</head>
<body>
    <div class="topbar">
        <a href="index.html">← Menu</a>
        <h1>Pong</h1>
        <span style="width:70px"></span>
    </div>

    <div class="stage">
        <canvas id="pong" width="800" height="500"></canvas>

        <div class="overlay" id="overlay">
            <h2 id="ov-title">Pong</h2>
            <p id="ov-text">Chegue primeiro à pontuação-alvo para vencer a IA.</p>
            <div class="row" id="ov-config">
                <label>Dificuldade
                    <select id="difficulty">
                        <option value="easy">Fácil</option>
                        <option value="normal" selected>Normal</option>
                        <option value="hard">Difícil</option>
                    </select>
                </label>
                <label>Pontos para vencer
                    <select id="target">
                        <option value="5">5</option>
                        <option value="7" selected>7</option>
                        <option value="11">11</option>
                    </select>
                </label>
            </div>
            <button class="btn" id="ov-button">Iniciar jogo</button>
            <div class="panel" style="min-width:300px">
                <table class="data" id="stats">
                    <thead><tr><th>Dificuldade</th><th>Vitórias</th><th>Derrotas</th><th>Aproveitamento</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <p class="hint">
        <kbd>↑</kbd> <kbd>↓</kbd> ou <kbd>W</kbd> <kbd>S</kbd> movem a barra · <kbd>Espaço</kbd>/<kbd>P</kbd> pausa ·
        em telas de toque, arraste o dedo sobre o campo
    </p>

    <script>
    (() => {
        'use strict';

        const canvas = document.getElementById('pong');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        const overlay = document.getElementById('overlay');
        const ovTitle = document.getElementById('ov-title');
        const ovText = document.getElementById('ov-text');
        const ovConfig = document.getElementById('ov-config');
        const ovButton = document.getElementById('ov-button');
        const diffSelect = document.getElementById('difficulty');
        const targetSelect = document.getElementById('target');
        const statsBody = document.querySelector('#stats tbody');

        // ---------- Constantes (velocidades em pixels por segundo) ----------
        const PADDLE_W = 12, PADDLE_H = 90, BALL_R = 9;
        const PLAYER_SPEED = 460;
        const BALL_START = 340, BALL_MAX = 760, BALL_BOOST = 1.06;
        const MAX_BOUNCE_ANGLE = Math.PI / 3;      // 60°
        const STEP = 1 / 120;                      // passo fixo da simulação

        const DIFFICULTY = {
            // speed: velocidade máxima da IA | error: erro de mira (px) | react: intervalo entre decisões (s)
            easy:   { label: 'Fácil',   speed: 260, error: 60, react: 0.25 },
            normal: { label: 'Normal',  speed: 350, error: 32, react: 0.14 },
            hard:   { label: 'Difícil', speed: 450, error: 10, react: 0.07 }
        };

        const player = { x: 20, y: 0, score: 0 };
        const ai = { x: W - 20 - PADDLE_W, y: 0, score: 0, target: H / 2, timer: 0 };
        const ball = { x: 0, y: 0, vx: 0, vy: 0, speed: BALL_START };

        let state = 'menu';   // menu | serve | play | paused | over
        let serveTimer = 0;
        let serveDir = 1;
        let targetScore = 7;
        let diffKey = 'normal';
        const keys = { up: false, down: false };

        // ---------- Estatísticas (localStorage, com tolerância a erros) ----------
        const STATS_KEY = 'pongStats';
        function loadStats() {
            try {
                const s = JSON.parse(localStorage.getItem(STATS_KEY));
                if (s && typeof s === 'object') return s;
            } catch (e) { /* ignora */ }
            return {};
        }
        function saveStats(stats) {
            try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) { /* ignora */ }
        }
        function renderStats() {
            const stats = loadStats();
            statsBody.innerHTML = '';
            for (const [key, cfg] of Object.entries(DIFFICULTY)) {
                const { w = 0, l = 0 } = stats[key] || {};
                const total = w + l;
                const pct = total ? Math.round((w / total) * 100) + '%' : '—';
                const tr = document.createElement('tr');
                [cfg.label, w, l, pct].forEach(v => {
                    const td = document.createElement('td');
                    td.textContent = v;
                    tr.appendChild(td);
                });
                statsBody.appendChild(tr);
            }
        }
        function recordResult(won) {
            const stats = loadStats();
            const s = stats[diffKey] || { w: 0, l: 0 };
            if (won) s.w++; else s.l++;
            stats[diffKey] = s;
            saveStats(stats);
        }

        // ---------- Controle do jogo ----------
        function showOverlay(title, text, buttonLabel, showConfig) {
            ovTitle.textContent = title;
            ovText.textContent = text;
            ovButton.textContent = buttonLabel;
            ovConfig.style.display = showConfig ? '' : 'none';
            renderStats();
            overlay.hidden = false;
            ovButton.focus();
        }

        function newMatch() {
            diffKey = diffSelect.value;
            targetScore = parseInt(targetSelect.value, 10);
            player.score = 0;
            ai.score = 0;
            player.y = H / 2 - PADDLE_H / 2;
            ai.y = H / 2 - PADDLE_H / 2;
            serveDir = Math.random() < 0.5 ? 1 : -1;
            overlay.hidden = true;
            startServe();
        }

        function startServe() {
            ball.x = W / 2;
            ball.y = H / 2;
            ball.vx = ball.vy = 0;
            ball.speed = BALL_START;
            ai.target = H / 2;
            serveTimer = 1;
            state = 'serve';
        }

        function launchBall() {
            const angle = (Math.random() * 2 - 1) * (Math.PI / 5);
            ball.vx = Math.cos(angle) * ball.speed * serveDir;
            ball.vy = Math.sin(angle) * ball.speed;
            state = 'play';
        }

        function togglePause() {
            if (state === 'play' || state === 'serve') {
                pausedFrom = state;
                state = 'paused';
                showOverlay('Pausado', 'Pressione Espaço para continuar.', 'Continuar', false);
            } else if (state === 'paused') {
                overlay.hidden = true;
                state = pausedFrom;
            }
        }
        let pausedFrom = 'play';

        function endMatch() {
            state = 'over';
            const won = player.score > ai.score;
            recordResult(won);
            showOverlay(
                won ? 'Você venceu! 🎉' : 'A IA venceu',
                `Placar final: ${player.score} × ${ai.score} (${DIFFICULTY[diffKey].label})`,
                'Jogar novamente',
                true
            );
        }

        ovButton.addEventListener('click', () => {
            if (state === 'paused') togglePause(); else newMatch();
        });

        // ---------- Entrada ----------
        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if (k === 'arrowup' || k === 'w') { keys.up = true; e.preventDefault(); }
            else if (k === 'arrowdown' || k === 's') { keys.down = true; e.preventDefault(); }
            else if ((k === ' ' || k === 'p') && !e.repeat) {
                // Se o foco estiver num botão, o Espaço o ativaria também: tratamos aqui.
                if (state === 'play' || state === 'serve' || state === 'paused') {
                    e.preventDefault();
                    togglePause();
                }
            }
        });
        window.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            if (k === 'arrowup' || k === 'w') keys.up = false;
            if (k === 'arrowdown' || k === 's') keys.down = false;
        });
        window.addEventListener('blur', () => {
            keys.up = keys.down = false;
            if (state === 'play' || state === 'serve') togglePause();
        });

        // Toque / caneta / mouse com botão pressionado: a barra segue o dedo
        function pointerToY(e) {
            const rect = canvas.getBoundingClientRect();
            return (e.clientY - rect.top) * (H / rect.height);
        }
        function movePlayerTo(e) {
            if (e.pointerType === 'mouse' && e.buttons === 0) return;
            player.y = clamp(pointerToY(e) - PADDLE_H / 2, 0, H - PADDLE_H);
        }
        canvas.addEventListener('pointerdown', movePlayerTo);
        canvas.addEventListener('pointermove', movePlayerTo);

        // ---------- Física ----------
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        // Prevê onde a bola chegará na vertical da IA, considerando rebotes nas paredes
        function predictBallY() {
            const t = (ai.x - ball.x) / ball.vx;
            const span = H - 2 * BALL_R;
            const period = 2 * span;
            let y = (ball.y + ball.vy * t) - BALL_R;
            y = ((y % period) + period) % period;
            if (y > span) y = period - y;
            return y + BALL_R;
        }

        function updateAI(dt) {
            const cfg = DIFFICULTY[diffKey];
            ai.timer -= dt;
            if (ai.timer <= 0) {
                ai.timer = cfg.react;
                if (ball.vx > 0) {
                    ai.target = predictBallY() + (Math.random() * 2 - 1) * cfg.error;
                } else {
                    ai.target = H / 2;          // bola indo embora: volta ao centro
                }
            }
            const center = ai.y + PADDLE_H / 2;
            const diff = ai.target - center;
            if (Math.abs(diff) > 6) {           // zona morta evita tremedeira
                ai.y += Math.sign(diff) * Math.min(cfg.speed * dt, Math.abs(diff));
            }
            ai.y = clamp(ai.y, 0, H - PADDLE_H);
        }

        function bounceOffPaddle(p, dir) {
            const rel = clamp((ball.y - (p.y + PADDLE_H / 2)) / (PADDLE_H / 2), -1, 1);
            const angle = rel * MAX_BOUNCE_ANGLE;
            ball.speed = Math.min(ball.speed * BALL_BOOST, BALL_MAX);
            ball.vx = Math.cos(angle) * ball.speed * dir;
            ball.vy = Math.sin(angle) * ball.speed;
        }

        function stepPlay(dt) {
            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;

            // Paredes superior e inferior (com correção de posição)
            if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }
            if (ball.y + BALL_R > H) { ball.y = H - BALL_R; ball.vy = -Math.abs(ball.vy); }

            // Barra do jogador (só quando a bola vai em direção a ela)
            if (ball.vx < 0 &&
                ball.x - BALL_R <= player.x + PADDLE_W && ball.x + BALL_R >= player.x &&
                ball.y + BALL_R >= player.y && ball.y - BALL_R <= player.y + PADDLE_H) {
                ball.x = player.x + PADDLE_W + BALL_R;
                bounceOffPaddle(player, 1);
            }
            // Barra da IA
            if (ball.vx > 0 &&
                ball.x + BALL_R >= ai.x && ball.x - BALL_R <= ai.x + PADDLE_W &&
                ball.y + BALL_R >= ai.y && ball.y - BALL_R <= ai.y + PADDLE_H) {
                ball.x = ai.x - BALL_R;
                bounceOffPaddle(ai, -1);
            }

            // Pontuação
            if (ball.x + BALL_R < 0) { ai.score++; scored(1); }
            else if (ball.x - BALL_R > W) { player.score++; scored(-1); }
        }

        function scored(nextServeDir) {
            if (player.score >= targetScore || ai.score >= targetScore) { endMatch(); return; }
            serveDir = nextServeDir;           // saque vai em direção a quem perdeu o ponto
            startServe();
        }

        function update(dt) {
            if (state === 'menu' || state === 'paused' || state === 'over') return;

            const dir = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
            player.y = clamp(player.y + dir * PLAYER_SPEED * dt, 0, H - PADDLE_H);

            if (state === 'serve') {
                updateAI(dt);
                serveTimer -= dt;
                if (serveTimer <= 0) launchBall();
                return;
            }
            updateAI(dt);
            stepPlay(dt);
        }

        // ---------- Desenho ----------
        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, W, H);

            // Rede
            ctx.fillStyle = 'rgba(255,255,255,.35)';
            for (let y = 8; y < H; y += 28) ctx.fillRect(W / 2 - 2, y, 4, 16);

            // Barras
            ctx.fillStyle = '#fff';
            ctx.fillRect(player.x, player.y, PADDLE_W, PADDLE_H);
            ctx.fillRect(ai.x, ai.y, PADDLE_W, PADDLE_H);

            // Bola
            if (state !== 'menu' && state !== 'over') {
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
                ctx.fill();
            }

            // Placar
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(player.score, W / 2 - 70, 60);
            ctx.fillText(ai.score, W / 2 + 70, 60);
            ctx.font = '14px Arial';
            ctx.fillStyle = 'rgba(255,255,255,.6)';
            ctx.fillText('VOCÊ', W / 2 - 70, 84);
            ctx.fillText('IA', W / 2 + 70, 84);

            if (state === 'serve') {
                ctx.font = 'bold 28px Arial';
                ctx.fillStyle = '#fff';
                ctx.fillText('Prepare-se…', W / 2, H - 40);
            }
        }

        // ---------- Loop com passo fixo (mesma velocidade em qualquer monitor) ----------
        let last = performance.now();
        let acc = 0;
        function frame(now) {
            acc += Math.min((now - last) / 1000, 0.1);   // evita "salto" ao voltar de outra aba
            last = now;
            while (acc >= STEP) { update(STEP); acc -= STEP; }
            draw();
            requestAnimationFrame(frame);
        }

        // Posição inicial para o fundo do menu
        player.y = H / 2 - PADDLE_H / 2;
        ai.y = H / 2 - PADDLE_H / 2;
        showOverlay('Pong', 'Chegue primeiro à pontuação-alvo para vencer a IA.', 'Iniciar jogo', true);
        requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
