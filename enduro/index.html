<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enduro</title>
    <link rel="stylesheet" href="../assets/game.css">
</head>
<body>
    <div class="topbar">
        <a href="../index.html">← Menu</a>
        <h1>Enduro</h1>
        <span style="width:70px"></span>
    </div>

    <div class="stage">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="overlay" id="overlay">
            <h2 id="ov-title">Enduro</h2>
            <p id="ov-text" style="white-space:pre-line">Ultrapasse o máximo de carros que conseguir.
Cuidado com a neblina e a neve!</p>
            <button class="btn" id="ov-button">Começar</button>
        </div>
    </div>

    <div class="touch-controls" id="touch">
        <button data-key="ArrowLeft" aria-label="Esquerda">◀</button>
        <button data-key="ArrowUp" aria-label="Acelerar">▲</button>
        <button data-key="ArrowDown" aria-label="Frear">▼</button>
        <button data-key="ArrowRight" aria-label="Direita">▶</button>
    </div>

    <p class="hint">
        <kbd>←</kbd> <kbd>→</kbd> desviar · <kbd>↑</kbd> acelerar · <kbd>↓</kbd> frear ·
        <kbd>Espaço</kbd>/<kbd>P</kbd> pausar · <kbd>Enter</kbd> reiniciar
    </p>

    <script src="game.js"></script>
</body>
</html>
