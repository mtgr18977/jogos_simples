<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="stylesheet" href="assets/game.css">
    <link rel="stylesheet" href="assets/tetris.css">
</head>
<body>
    <div class="topbar">
        <a href="index.html">← Menu</a>
        <h1>Tetris</h1>
        <span style="width:70px"></span>
    </div>

    <div id="layout">
        <div class="stage">
            <canvas id="board" width="240" height="480"></canvas>

            <div class="overlay" id="overlay">
                <h2 id="ov-title">Tetris</h2>
                <p id="ov-text">Escolha um modo de jogo</p>
                <div id="ov-modes" style="display:flex;flex-direction:column;gap:8px;width:100%;max-width:210px">
                    <button class="btn mode-btn" data-mode="classic">Clássico<small>Sem limite, a velocidade aumenta</small></button>
                    <button class="btn mode-btn" data-mode="time">Tempo<small>Faça o máximo de pontos em 2 min</small></button>
                    <button class="btn mode-btn" data-mode="turbo">Turbo<small>Começa no nível 10 e sobe a cada 5 linhas</small></button>
                    <button class="btn mode-btn" data-mode="challenge">Desafio<small>Limpe 20 linhas começando com lixo</small></button>
                </div>
                <button class="btn" id="ov-button" hidden>Continuar</button>
                <div id="ov-extra"></div>
            </div>
        </div>

        <div id="side">
            <div class="panel"><h3>GUARDADA (C)</h3><canvas id="hold" width="80" height="80"></canvas></div>
            <div class="panel"><h3>PRÓXIMA</h3><canvas id="next" width="80" height="80"></canvas></div>
            <div class="panel">
                <div class="stat"><span>Modo</span><span id="s-mode">—</span></div>
                <div class="stat"><span>Pontos</span><span id="s-score">0</span></div>
                <div class="stat"><span>Nível</span><span id="s-level">1</span></div>
                <div class="stat"><span>Linhas</span><span id="s-lines">0</span></div>
                <div class="stat"><span id="s-time-label">Tempo</span><span id="s-time">0:00</span></div>
            </div>
            <div class="panel">
                <h3 id="rank-title">TOP 5</h3>
                <table class="data" id="ranking"><tbody></tbody></table>
            </div>
        </div>
    </div>

    <div class="touch-controls" id="touch">
        <button data-act="left" aria-label="Esquerda">◀</button>
        <button data-act="rotate" aria-label="Girar">⟳</button>
        <button data-act="right" aria-label="Direita">▶</button>
        <button data-act="down" aria-label="Descer">▼</button>
        <button data-act="drop" aria-label="Queda rápida">⤓</button>
        <button data-act="hold" aria-label="Guardar">H</button>
    </div>

    <p class="hint">
        <kbd>←</kbd> <kbd>→</kbd> mover · <kbd>↑</kbd> girar horário · <kbd>Q</kbd> anti-horário ·
        <kbd>↓</kbd> descer · <kbd>Espaço</kbd> queda rápida · <kbd>C</kbd> guardar · <kbd>P</kbd> pausar
    </p>

    <script src="assets/audio.js"></script>
    <script src="assets/fit.js"></script>
    <script src="tetris-logic.js"></script>
    <script src="tetris.js"></script>
</body>
</html>
